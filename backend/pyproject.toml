[tool.poetry]
name = "studynos-backend"
version = "0.1.0"
description = "StudyOS Backend API"
authors = ["StudyOS Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
pydantic = {extras = ["email"], version = "^2.5.0"}
openai = "^1.3.8"
scikit-learn = "^1.3.2"
pandas = "^2.1.4"
numpy = "^1.25.2"
requests = "^2.31.0"
python-multipart = "^0.0.6"
apscheduler = "^3.10.4"
resend = "^0.6.0"
stripe = "^7.8.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"